name: Android APK bauen

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Dateien laden
        uses: actions/checkout@v4

      - name: 2. Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 4. Capacitor & BLE-Plugin installieren
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi
          if ! grep -q "cordova.js" www/index.html; then
            sed -i 's|</body>|<script src="cordova.js"></script></body>|' www/index.html
          fi
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 cordova-plugin-ble-central
          npx cap init "LumenControl" "de.jgu.meinzimmer" --web-dir www
          npx cap add android

      - name: 5. Eigenes App-Icon, Home-Widget & Shortcuts einbauen
        run: |
          python3 - << 'EOF'
          import os, zlib, struct, math, shutil

          res_dir = "android/app/src/main/res"
          java_dir = "android/app/src/main/java/de/jgu/meinzimmer"
          os.makedirs(java_dir, exist_ok=True)
          os.makedirs(f"{res_dir}/drawable", exist_ok=True)
          os.makedirs(f"{res_dir}/layout", exist_ok=True)
          os.makedirs(f"{res_dir}/xml", exist_ok=True)

          # 1. Eigenes App-Icon (Neon-LED-Ring auf dunklem Grund) als PNG erzeugen
          def create_led_icon_png(size=192):
              raw = bytearray()
              cx, cy = size / 2.0, size / 2.0
              r_outer = size * 0.36
              r_inner = size * 0.25
              for y in range(size):
                  raw.append(0)
                  for x in range(size):
                      dx, dy = x - cx, y - cy
                      dist = math.hypot(dx, dy)
                      # Abgerundetes dunkles Icon-Quadrat
                      bg_r, bg_g, bg_b = 13, 18, 28
                      if abs(dx) > size*0.46 or abs(dy) > size*0.46:
                          raw.extend([0, 0, 0, 0])
                          continue
                      # Leuchtender Farbverlauf-Ring (Türkis bis Warmgold)
                      if r_inner <= dist <= r_outer:
                          angle = (math.atan2(dy, dx) + math.pi) / (2 * math.pi)
                          r = int(56 * (1 - angle) + 251 * angle)
                          g = int(189 * (1 - angle) + 191 * angle)
                          b = int(248 * (1 - angle) + 36 * angle)
                          raw.extend([r, g, b, 255])
                      elif dist < size * 0.09:
                          # Warmer Lichtkern in der Mitte
                          raw.extend([255, 180, 70, 255])
                      else:
                          raw.extend([bg_r, bg_g, bg_b, 255])
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack("!IIBBBBB", size, size, 8, 6, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")

          icon_bytes = create_led_icon_png(192)
          if os.path.exists(f"{res_dir}/mipmap-anydpi-v26"):
              shutil.rmtree(f"{res_dir}/mipmap-anydpi-v26")
          for folder in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
              p = f"{res_dir}/{folder}"
              os.makedirs(p, exist_ok=True)
              for name in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                  with open(f"{p}/{name}", "wb") as f:
                      f.write(icon_bytes)

          # 2. App-Name in strings.xml auf LumenControl setzen
          with open(f"{res_dir}/values/strings.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">LumenControl</string>
              <string name="title_activity_main">LumenControl</string>
              <string name="package_name">de.jgu.meinzimmer</string>
              <string name="custom_url_scheme">lumencontrol</string>
          </resources>''')

          # 3. Widget-Hintergrund & Button-Design
          with open(f"{res_dir}/drawable/widget_bg.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#E6111621" />
              <corners android:radius="18dp" />
              <stroke android:width="1dp" android:color="#3338BDF8" />
          </shape>''')

          with open(f"{res_dir}/drawable/widget_btn_bg.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FF1E2636" />
              <corners android:radius="12dp" />
              <stroke android:width="1dp" android:color="#33FFFFFF" />
          </shape>''')

          # 4. Home-Widget Layout (3 Schnellbuttons: Ein/Aus, ⭐ Modus, ⏱️ 1h Timer)
          with open(f"{res_dir}/layout/led_widget.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:padding="10dp"
              android:background="@drawable/widget_bg"
              android:gravity="center_vertical">

              <Button
                  android:id="@+id/w_btn_toggle"
                  android:layout_width="0dp"
                  android:layout_height="48dp"
                  android:layout_weight="1"
                  android:layout_marginEnd="6dp"
                  android:background="@drawable/widget_btn_bg"
                  android:text="⏻ Ein/Aus"
                  android:textColor="#FFFFFF"
                  android:textSize="13sp"
                  android:textAllCaps="false" />

              <Button
                  android:id="@+id/w_btn_fav"
                  android:layout_width="0dp"
                  android:layout_height="48dp"
                  android:layout_weight="1"
                  android:layout_marginEnd="6dp"
                  android:background="@drawable/widget_btn_bg"
                  android:text="⭐ Modus"
                  android:textColor="#FBBF24"
                  android:textSize="13sp"
                  android:textAllCaps="false" />

              <Button
                  android:id="@+id/w_btn_timer"
                  android:layout_width="0dp"
                  android:layout_height="48dp"
                  android:layout_weight="1"
                  android:background="@drawable/widget_btn_bg"
                  android:text="⏱️ 1 Std."
                  android:textColor="#38BDF8"
                  android:textSize="13sp"
                  android:textAllCaps="false" />
          </LinearLayout>''')

          # 5. Widget-Metadaten & App-Shortcuts (für langes Drücken & Google Assistant)
          with open(f"{res_dir}/xml/led_widget_info.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="55dp"
              android:updatePeriodMillis="0"
              android:initialLayout="@layout/led_widget"
              android:resizeMode="horizontal"
              android:widgetCategory="home_screen" />''')

          with open(f"{res_dir}/xml/shortcuts.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
              <shortcut
                  android:shortcutId="sc_toggle"
                  android:enabled="true"
                  android:icon="@mipmap/ic_launcher"
                  android:shortcutShortLabel="@string/sc_toggle_short"
                  android:shortcutLongLabel="@string/sc_toggle_long">
                  <intent
                      android:action="android.intent.action.VIEW"
                      android:targetPackage="de.jgu.meinzimmer"
                      android:targetClass="de.jgu.meinzimmer.MainActivity"
                      android:data="lumencontrol://action?cmd=toggle" />
              </shortcut>
              <shortcut
                  android:shortcutId="sc_fav"
                  android:enabled="true"
                  android:icon="@mipmap/ic_launcher"
                  android:shortcutShortLabel="@string/sc_fav_short"
                  android:shortcutLongLabel="@string/sc_fav_long">
                  <intent
                      android:action="android.intent.action.VIEW"
                      android:targetPackage="de.jgu.meinzimmer"
                      android:targetClass="de.jgu.meinzimmer.MainActivity"
                      android:data="lumencontrol://action?cmd=fav" />
              </shortcut>
              <shortcut
                  android:shortcutId="sc_timer"
                  android:enabled="true"
                  android:icon="@mipmap/ic_launcher"
                  android:shortcutShortLabel="@string/sc_timer_short"
                  android:shortcutLongLabel="@string/sc_timer_long">
                  <intent
                      android:action="android.intent.action.VIEW"
                      android:targetPackage="de.jgu.meinzimmer"
                      android:targetClass="de.jgu.meinzimmer.MainActivity"
                      android:data="lumencontrol://action?cmd=timer60" />
              </shortcut>
          </shortcuts>''')

          # Shortcut-Texte in strings.xml ergänzen
          with open(f"{res_dir}/values/strings.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">LumenControl</string>
              <string name="title_activity_main">LumenControl</string>
              <string name="package_name">de.jgu.meinzimmer</string>
              <string name="custom_url_scheme">lumencontrol</string>
              <string name="sc_toggle_short">Ein / Aus</string>
              <string name="sc_toggle_long">LEDs Ein / Aus umschalten</string>
              <string name="sc_fav_short">⭐ Favorit-Modus</string>
              <string name="sc_fav_long">⭐ Gespeicherten Modus aktivieren</string>
              <string name="sc_timer_short">⏱️ 1h Timer</string>
              <string name="sc_timer_long">⏱️ 1-Stunden-Timer starten</string>
          </resources>''')

          # 6. Java-Code für MainActivity (Deep-Link Bridge) & LedWidgetProvider
          with open(f"{java_dir}/MainActivity.java", "w") as f:
              f.write('''package de.jgu.meinzimmer;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SleepTimerPlugin.class);
                  super.onCreate(savedInstanceState);
                  handleActionIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleActionIntent(intent);
              }

              private void handleActionIntent(Intent intent) {
                  if (intent == null) return;
                  Uri data = intent.getData();
                  if (data != null && data.getQueryParameter("cmd") != null) {
                      final String cmd = data.getQueryParameter("cmd");
                      final long ts = System.currentTimeMillis();
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          final WebView wv = this.bridge.getWebView();
                          for (int delay : new int[]{300, 1000, 2000}) {
                              wv.postDelayed(() -> {
                                  wv.evaluateJavascript("if(window.runExternalCommand) window.runExternalCommand('" + cmd + "', " + ts + ");", null);
                              }, delay);
                          }
                      }
                  }
              }
          }''')

          with open(f"{java_dir}/LedWidgetProvider.java", "w") as f:
              f.write('''package de.jgu.meinzimmer;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.widget.RemoteViews;

          public class LedWidgetProvider extends AppWidgetProvider {
              private static PendingIntent buildCmdIntent(Context context, String cmd, int reqCode) {
                  Intent intent = new Intent(context, MainActivity.class);
                  intent.setAction(Intent.ACTION_VIEW);
                  intent.setData(Uri.parse("lumencontrol://action?cmd=" + cmd));
                  intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  return PendingIntent.getActivity(
                      context,
                      reqCode,
                      intent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
              }

              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  for (int appWidgetId : appWidgetIds) {
                      RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.led_widget);
                      views.setOnClickPendingIntent(R.id.w_btn_toggle, buildCmdIntent(context, "toggle", 101));
                      views.setOnClickPendingIntent(R.id.w_btn_fav,    buildCmdIntent(context, "fav",    102));
                      views.setOnClickPendingIntent(R.id.w_btn_timer,  buildCmdIntent(context, "timer60",103));
                      appWidgetManager.updateAppWidget(appWidgetId, views);
                  }
              }
          }''')

          # 6b. Nativer Ausschalt-Timer (läuft auch im Hintergrund / bei Bildschirm aus)
          with open(f"{java_dir}/SleepTimerPlugin.java", "w") as f:
              f.write(r'''package de.jgu.meinzimmer;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "SleepTimer")
          public class SleepTimerPlugin extends Plugin {

              private long readLong(PluginCall call, String key) {
                  Double d = call.getDouble(key);
                  return d == null ? 0L : d.longValue();
              }

              @PluginMethod
              public void start(PluginCall call) {
                  long endTs = readLong(call, "endTs");
                  if (endTs <= System.currentTimeMillis()) {
                      call.reject("endTs liegt in der Vergangenheit");
                      return;
                  }
                  if (Build.VERSION.SDK_INT >= 33 && getActivity() != null
                          && ContextCompat.checkSelfPermission(getContext(), Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(getActivity(), new String[]{ Manifest.permission.POST_NOTIFICATIONS }, 4712);
                  }
                  Intent i = new Intent(getContext(), SleepTimerService.class);
                  i.setAction(SleepTimerService.ACTION_START);
                  i.putExtra("mac", call.getString("mac", ""));
                  i.putExtra("startTs", readLong(call, "startTs"));
                  i.putExtra("endTs", endTs);
                  i.putExtra("fade", Boolean.TRUE.equals(call.getBoolean("fade", true)));
                  i.putExtra("frameHex", call.getString("frameHex", ""));
                  try {
                      if (Build.VERSION.SDK_INT >= 26) getContext().startForegroundService(i);
                      else getContext().startService(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Timer-Dienst konnte nicht gestartet werden: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void update(PluginCall call) {
                  SleepTimerService.applyUpdate(
                      call.hasOption("fade") ? call.getBoolean("fade") : null,
                      call.getString("frameHex", null)
                  );
                  call.resolve();
              }

              @PluginMethod
              public void cancel(PluginCall call) {
                  getContext().stopService(new Intent(getContext(), SleepTimerService.class));
                  call.resolve();
              }

              @PluginMethod
              public void getStatus(PluginCall call) {
                  JSObject ret = new JSObject();
                  long end = SleepTimerService.activeEndTs;
                  ret.put("active", end > System.currentTimeMillis());
                  ret.put("startTs", SleepTimerService.activeStartTs);
                  ret.put("endTs", end);
                  call.resolve(ret);
              }
          }''')

          with open(f"{java_dir}/SleepTimerService.java", "w") as f:
              f.write(r'''package de.jgu.meinzimmer;

          import android.annotation.SuppressLint;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothGatt;
          import android.bluetooth.BluetoothGattCallback;
          import android.bluetooth.BluetoothGattCharacteristic;
          import android.bluetooth.BluetoothGattService;
          import android.bluetooth.BluetoothManager;
          import android.bluetooth.BluetoothProfile;
          import android.bluetooth.BluetoothStatusCodes;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.os.SystemClock;
          import java.util.UUID;
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.TimeUnit;

          /**
           * Ausschalt-Timer als Vordergrund-Dienst: läuft weiter, wenn die App im Hintergrund
           * ist oder der Bildschirm aus ist. Fadet die LEDs sanft aus und schaltet sie am Ende
           * per Bluetooth (eigene GATT-Verbindung) aus.
           */
          public class SleepTimerService extends Service {
              public static final String ACTION_START = "de.jgu.meinzimmer.TIMER_START";
              public static final String ACTION_STOP  = "de.jgu.meinzimmer.TIMER_STOP";

              private static final String CHANNEL_ID = "lumen_sleep_timer";
              private static final int NOTIF_ID = 4711;
              private static final UUID SERVICE_UUID = UUID.fromString("0000ffff-0000-1000-8000-00805f9b34fb");
              private static final UUID WRITE_UUID   = UUID.fromString("0000ff01-0000-1000-8000-00805f9b34fb");
              private static final int TOTAL_LEDS = 180;
              private static final int FADE_STEPS = 40;

              public static volatile long activeStartTs = 0;
              public static volatile long activeEndTs = 0;
              private static volatile SleepTimerService instance;

              private HandlerThread workerThread;
              private Handler worker;
              private PowerManager.WakeLock wakeLock;

              private String mac = "";
              private long startTs, endTs;
              private volatile boolean fade = true;
              private volatile byte[] baseFrame;
              private int lastStep = -1;
              private int packetCounter = 0x60;

              private volatile BluetoothGatt gatt;
              private volatile BluetoothGattCharacteristic writeChar;
              private volatile CountDownLatch readyLatch;
              private volatile CountDownLatch writeLatch;

              public static void applyUpdate(Boolean newFade, String frameHex) {
                  SleepTimerService s = instance;
                  if (s == null) return;
                  if (newFade != null) s.fade = newFade;
                  if (frameHex != null) {
                      byte[] f = parseFrame(frameHex);
                      if (f != null) {
                          s.baseFrame = f;
                          s.lastStep = -1; // beim nächsten Tick neu senden, falls Fade schon läuft
                      }
                  }
              }

              private static byte[] parseFrame(String hex) {
                  if (hex == null || hex.length() != TOTAL_LEDS * 6) return null;
                  byte[] out = new byte[TOTAL_LEDS * 3];
                  try {
                      for (int i = 0; i < out.length; i++) {
                          out[i] = (byte) Integer.parseInt(hex.substring(i * 2, i * 2 + 2), 16);
                      }
                  } catch (NumberFormatException e) {
                      return null;
                  }
                  return out;
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  instance = this;
                  workerThread = new HandlerThread("LumenSleepTimer");
                  workerThread.start();
                  worker = new Handler(workerThread.getLooper());
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "Ausschalt-Timer", NotificationManager.IMPORTANCE_LOW);
                      ch.setDescription("Zeigt den laufenden LED-Ausschalt-Timer an");
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (intent == null || intent.getLongExtra("endTs", 0) <= System.currentTimeMillis()) {
                      goForeground(System.currentTimeMillis());
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  mac = intent.getStringExtra("mac");
                  endTs = intent.getLongExtra("endTs", 0);
                  startTs = intent.getLongExtra("startTs", System.currentTimeMillis());
                  fade = intent.getBooleanExtra("fade", true);
                  baseFrame = parseFrame(intent.getStringExtra("frameHex"));
                  lastStep = -1;
                  activeStartTs = startTs;
                  activeEndTs = endTs;

                  goForeground(endTs);

                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (wakeLock == null && pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "LumenControl:SleepTimer");
                      wakeLock.setReferenceCounted(false);
                  }
                  if (wakeLock != null) wakeLock.acquire(Math.max(60000L, endTs - System.currentTimeMillis() + 5 * 60000L));

                  worker.removeCallbacks(tick);
                  worker.post(tick);
                  return START_REDELIVER_INTENT;
              }

              private void goForeground(long end) {
                  Intent open = new Intent(this, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent openPi = PendingIntent.getActivity(this, 201, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Intent stop = new Intent(this, SleepTimerService.class);
                  stop.setAction(ACTION_STOP);
                  PendingIntent stopPi = PendingIntent.getService(this, 202, stop, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, CHANNEL_ID) : new Notification.Builder(this);
                  b.setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                   .setContentTitle("LED-Timer läuft")
                   .setContentText("LEDs werden automatisch ausgeschaltet")
                   .setContentIntent(openPi)
                   .setOngoing(true)
                   .setShowWhen(true)
                   .setWhen(end)
                   .setUsesChronometer(true)
                   .addAction(new Notification.Action.Builder(0, "Stopp", stopPi).build());
                  if (Build.VERSION.SDK_INT >= 24) b.setChronometerCountDown(true);
                  Notification n = b.build();
                  try {
                      if (Build.VERSION.SDK_INT >= 29) startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_CONNECTED_DEVICE);
                      else startForeground(NOTIF_ID, n);
                  } catch (Exception e) {
                      // z.B. fehlende Bluetooth-Berechtigung: Timer trotzdem so gut wie möglich weiterlaufen lassen
                  }
              }

              private final Runnable tick = new Runnable() {
                  @Override
                  public void run() {
                      long now = System.currentTimeMillis();
                      long remaining = endTs - now;
                      if (remaining <= 0) {
                          finishTimer();
                          return;
                      }
                      long total = Math.max(1000L, endTs - startTs);
                      long fadeWindow = Math.min(10L * 60L * 1000L, (long) (total * 0.5));
                      long delay;
                      if (fade && baseFrame != null && remaining <= fadeWindow) {
                          double p = 1.0 - (double) remaining / (double) fadeWindow;
                          int step = (int) Math.floor(p * FADE_STEPS);
                          if (step != lastStep) {
                              lastStep = step;
                              sendFadedFrame(p);
                          }
                          delay = 1000L;
                      } else {
                          // bis kurz vor Fade-Beginn bzw. Ende schlafen (max. 30 s)
                          long untilFade = remaining - fadeWindow;
                          delay = Math.max(1000L, Math.min(30000L, (fade && untilFade > 0) ? untilFade : remaining));
                      }
                      worker.postDelayed(this, Math.min(delay, Math.max(250L, remaining)));
                  }
              };

              private void finishTimer() {
                  boolean ok = false;
                  for (int attempt = 0; attempt < 4 && !ok; attempt++) {
                      if (ensureConnected()) ok = sendPowerOff();
                      if (!ok) {
                          closeGatt();
                          SystemClock.sleep(3000);
                      }
                  }
                  activeEndTs = 0;
                  activeStartTs = 0;
                  stopSelf();
              }

              // ---------- Bluetooth ----------
              private final BluetoothGattCallback gattCallback = new BluetoothGattCallback() {
                  @SuppressLint("MissingPermission")
                  @Override
                  public void onConnectionStateChange(BluetoothGatt g, int status, int newState) {
                      try {
                          if (newState == BluetoothProfile.STATE_CONNECTED && status == BluetoothGatt.GATT_SUCCESS) {
                              if (!g.requestMtu(517)) g.discoverServices();
                          } else if (newState == BluetoothProfile.STATE_DISCONNECTED) {
                              writeChar = null;
                              if (g == gatt) gatt = null;
                              try { g.close(); } catch (Exception ignored) {}
                              releaseLatches();
                          }
                      } catch (SecurityException e) {
                          releaseLatches();
                      }
                  }

                  @SuppressLint("MissingPermission")
                  @Override
                  public void onMtuChanged(BluetoothGatt g, int mtu, int status) {
                      try { g.discoverServices(); } catch (SecurityException e) { releaseLatches(); }
                  }

                  @Override
                  public void onServicesDiscovered(BluetoothGatt g, int status) {
                      BluetoothGattService s = g.getService(SERVICE_UUID);
                      if (s != null) writeChar = s.getCharacteristic(WRITE_UUID);
                      CountDownLatch l = readyLatch;
                      if (l != null) l.countDown();
                  }

                  @Override
                  public void onCharacteristicWrite(BluetoothGatt g, BluetoothGattCharacteristic c, int status) {
                      CountDownLatch l = writeLatch;
                      if (l != null) l.countDown();
                  }
              };

              private void releaseLatches() {
                  CountDownLatch r = readyLatch; if (r != null) r.countDown();
                  CountDownLatch w = writeLatch; if (w != null) w.countDown();
              }

              @SuppressLint("MissingPermission")
              private boolean ensureConnected() {
                  if (gatt != null && writeChar != null) return true;
                  closeGatt();
                  try {
                      BluetoothManager bm = (BluetoothManager) getSystemService(Context.BLUETOOTH_SERVICE);
                      BluetoothAdapter ad = bm != null ? bm.getAdapter() : null;
                      if (ad == null || !ad.isEnabled() || mac == null || !BluetoothAdapter.checkBluetoothAddress(mac)) return false;
                      BluetoothDevice dev = ad.getRemoteDevice(mac);
                      readyLatch = new CountDownLatch(1);
                      gatt = Build.VERSION.SDK_INT >= 23
                          ? dev.connectGatt(this, false, gattCallback, BluetoothDevice.TRANSPORT_LE)
                          : dev.connectGatt(this, false, gattCallback);
                      if (gatt == null) return false;
                      readyLatch.await(20, TimeUnit.SECONDS);
                  } catch (SecurityException | InterruptedException e) {
                      return false;
                  }
                  if (writeChar == null) {
                      closeGatt();
                      return false;
                  }
                  return true;
              }

              @SuppressLint("MissingPermission")
              private void closeGatt() {
                  BluetoothGatt g = gatt;
                  gatt = null;
                  writeChar = null;
                  if (g != null) {
                      try { g.disconnect(); } catch (Exception ignored) {}
                      try { g.close(); } catch (Exception ignored) {}
                  }
              }

              @SuppressLint("MissingPermission")
              private boolean writePacket(byte[] data) {
                  for (int attempt = 0; attempt < 3; attempt++) {
                      BluetoothGatt g = gatt;
                      BluetoothGattCharacteristic c = writeChar;
                      if (g == null || c == null) return false;
                      writeLatch = new CountDownLatch(1);
                      boolean ok;
                      try {
                          if (Build.VERSION.SDK_INT >= 33) {
                              ok = g.writeCharacteristic(c, data, BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE) == BluetoothStatusCodes.SUCCESS;
                          } else {
                              c.setWriteType(BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE);
                              c.setValue(data);
                              ok = g.writeCharacteristic(c);
                          }
                      } catch (SecurityException e) {
                          return false;
                      }
                      if (ok) {
                          try { writeLatch.await(2, TimeUnit.SECONDS); } catch (InterruptedException ignored) {}
                          SystemClock.sleep(18);
                          return true;
                      }
                      SystemClock.sleep(60);
                  }
                  return false;
              }

              private void sendFadedFrame(double p) {
                  byte[] base = baseFrame;
                  if (base == null) return;
                  // entspricht compute180Leds() aus der App: Helligkeit (1-p)^1.3 und Farbverschiebung Richtung Rot
                  double q = Math.max(0.0, 1.0 - p);
                  double fr = Math.pow(q, 2.1), fg = Math.pow(q, 2.9), fb = Math.pow(q, 4.3);
                  byte[] rgb = new byte[TOTAL_LEDS * 3];
                  for (int i = 0; i < TOTAL_LEDS; i++) {
                      rgb[i * 3]     = (byte) Math.round((base[i * 3] & 0xFF) * fr);
                      rgb[i * 3 + 1] = (byte) Math.round((base[i * 3 + 1] & 0xFF) * fg);
                      rgb[i * 3 + 2] = (byte) Math.round((base[i * 3 + 2] & 0xFF) * fb);
                  }
                  if (!ensureConnected()) return;
                  if (!transmitRgb(rgb)) closeGatt();
              }

              private boolean transmitRgb(byte[] rgb) {
                  final int lenWord = 549;
                  final int lenHi = (lenWord >> 8) & 0xFF, lenLo = lenWord & 0xFF;
                  byte[] full = new byte[3 + rgb.length + 5 + 1];
                  int k = 0;
                  full[k++] = 0x59; full[k++] = (byte) lenHi; full[k++] = (byte) lenLo;
                  System.arraycopy(rgb, 0, full, k, rgb.length); k += rgb.length;
                  byte[] tail = { 0x00, 0x00, 0x01, 0x64, 0x01 };
                  System.arraycopy(tail, 0, full, k, tail.length); k += tail.length;
                  int sum = 0;
                  for (int i = 0; i < k; i++) sum += full[i] & 0xFF;
                  full[k] = (byte) (sum & 0xFF);

                  packetCounter = (packetCounter + 1) & 0xFF;
                  final int chunkSize = 165;
                  int totalChunks = (full.length + chunkSize - 1) / chunkSize;
                  for (int f = 0; f < totalChunks; f++) {
                      int from = f * chunkSize;
                      int len = Math.min(chunkSize, full.length - from);
                      boolean isLast = (f == totalChunks - 1);
                      byte fragFlag = (byte) (isLast ? 0x80 : 0x00);
                      byte[] packet;
                      if (f == 0) {
                          packet = new byte[8 + len];
                          packet[0] = 0x40; packet[1] = (byte) packetCounter; packet[2] = fragFlag; packet[3] = 0x00;
                          packet[4] = (byte) lenHi; packet[5] = (byte) lenLo; packet[6] = (byte) (len + 1); packet[7] = 0x0b;
                          System.arraycopy(full, from, packet, 8, len);
                      } else {
                          packet = new byte[5 + len];
                          packet[0] = 0x40; packet[1] = (byte) packetCounter; packet[2] = fragFlag; packet[3] = (byte) f;
                          packet[4] = (byte) len;
                          System.arraycopy(full, from, packet, 5, len);
                      }
                      if (!writePacket(packet)) return false;
                  }
                  return true;
              }

              private boolean sendPowerOff() {
                  packetCounter = (packetCounter + 1) & 0xFF;
                  byte[] payload = { 0x3b, 0x24, 0, 0, 0, 0, 0, 0, 0, 0x32, 0, 0 };
                  int sum = 0;
                  for (byte b : payload) sum += b & 0xFF;
                  byte[] pkt = new byte[8 + payload.length + 1];
                  byte[] header = { 0x00, (byte) packetCounter, (byte) 0x80, 0x00, 0x00, 0x0d, 0x0e, 0x0b };
                  System.arraycopy(header, 0, pkt, 0, header.length);
                  System.arraycopy(payload, 0, pkt, header.length, payload.length);
                  pkt[pkt.length - 1] = (byte) (sum & 0xFF);
                  return writePacket(pkt);
              }

              @Override
              public void onDestroy() {
                  instance = null;
                  activeEndTs = 0;
                  activeStartTs = 0;
                  if (worker != null) {
                      worker.removeCallbacksAndMessages(null);
                      worker.post(this::closeGatt);
                  }
                  if (workerThread != null) workerThread.quitSafely();
                  if (wakeLock != null && wakeLock.isHeld()) {
                      try { wakeLock.release(); } catch (Exception ignored) {}
                  }
                  if (Build.VERSION.SDK_INT >= 24) stopForeground(STOP_FOREGROUND_REMOVE);
                  else stopForeground(true);
                  super.onDestroy();
              }
          }''')


